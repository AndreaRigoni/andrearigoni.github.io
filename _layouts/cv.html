<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.name }} – {{ page.headline | default: site.description }}</title>
    <meta name="description" content="{{ page.summary | strip_html | strip_newlines }}">
    <meta name="author" content="{{ site.name }}">
    <meta property="og:title" content="{{ site.name }}">
    <meta property="og:description" content="{{ page.summary | strip_html | strip_newlines }}">
    <meta property="og:image" content="{{ site.baseurl }}/images/cv/portrait.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/cv.css">
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml">
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="{{ site.baseurl }}/">{{ site.name }}</a>
        <nav class="topnav" aria-label="Sections">
          <a href="#research">Research</a>
          <a href="#mdsplus">MDSplus</a>
          <a href="#teaching">Teaching</a>
          <a href="#mentorship">Mentorship</a>
          <a href="#experience">Experience</a>
          <a href="#publications">Publications</a>
          <a href="{{ site.baseurl }}/blog/">Blog</a>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>
          <a href="mailto:andrea.rigoni@igi.cnr.it">andrea.rigoni@igi.cnr.it</a> ·
          Consorzio RFX, Corso Stati Uniti 4, 35127 Padova, Italy
        </p>
        <p class="muted">
          <a href="https://github.com/{{ site.footer-links.github }}">GitHub</a> ·
          <a href="https://www.linkedin.com/in/{{ site.footer-links.linkedin }}">LinkedIn</a> ·
          <a href="https://stackoverflow.com/{{ site.footer-links.stackoverflow }}">Stack Overflow</a> ·
          <a href="{{ site.baseurl }}/blog/">Blog</a>
        </p>
      </div>
    </footer>
    {% include analytics.html %}
  </body>
</html>
